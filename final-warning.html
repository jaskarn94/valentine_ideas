<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Final Warning | Cursed Archive</title>
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body class="horror">
    <main class="scene scene-center">
      <section class="card card-alert stagger">
        <p class="mono subtle">SUBJECT FILE LOCKED</p>
        <h1 class="title-main" data-glitch>do not open subject file</h1>
        <p class="lead">
          Risk level is now unstable. Countdown to irreversible disclosure has
          started.
        </p>
        <p class="countdown mono">T-minus <span data-countdown>10</span>s</p>
        <div id="decryptLoader" class="loader hidden">
          <p class="mono">Decrypting sealed confession...</p>
          <div class="progress-wrap">
            <div class="progress-bar" id="progressBar"></div>
          </div>
        </div>
        <div class="actions">
          <button class="btn btn-danger hidden" id="openFileBtn" type="button">
            Open Subject File
          </button>
        </div>
      </section>
    </main>
    <script src="./assets/script.js"></script>
  </body>
</html>
